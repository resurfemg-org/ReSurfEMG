# GitHub actions are pinned to commit hashes to ensure stability and security.

name: Deployability
# Declare default permissions as read only.
permissions: read-all
on:
    pull_request:
        branches:
            - 'main'
    push:
        branches:
            - 'main'

jobs:
  Test-Sphinx:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14
    - run: python3 -m venv .venv
    - run: .venv/bin/python -m pip install wheel sphinx setuptools
    - run: .venv/bin/python -m pip install -e .[docs]
    - run: .venv/bin/python setup.py apidoc
    - run: .venv/bin/python setup.py build_sphinx -W

  Test-Python-Versions-Ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - run: python3 -m venv .venv
    - run: .venv/bin/python -m pip install wheel
    - run: .venv/bin/python -m pip install -e .[tests]
    - run: .venv/bin/python -m pytest

  Test-Sanity-Windows:
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14
    - run: python -m venv .venv
    - run: .venv\Scripts\pip install wheel setuptools
    - run: .venv\Scripts\pip install -e .[tests]
    - run: .venv\Scripts\python -m pytest --cov . --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: resurfemg-org/ReSurfEMG


  Test-Sanity-OSX:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14
    - run: python3 -m venv .venv
    - run: .venv/bin/python -m pip install wheel
    - run: .venv/bin/python -m pip install -e .[tests]
    - run: .venv/bin/python -m pytest
