# GitHub actions are pinned to commit hashes to ensure stability and security.

name: Release
# Declare default permissions as read only.
permissions: read-all
on:
  push:
    tags:
      - v*

jobs:
  PyPIBuild:
    permissions:
      attestations: write
      
    if: ${{ github.repository == 'resurfemg-org/resurfemg' }}
    name: Tagged Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.14
      - run: python3.14 -m venv .venv
      - run: .venv/bin/python -m pip install build wheel twine
      - run: .venv/bin/python -m build
      - run: >-
          TWINE_USERNAME=__token__
          TWINE_PASSWORD=${{ secrets.PYPI_TOKEN }}
          .venv/bin/python -m twine upload --skip-existing ./dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-build
          path: dist/*

  PublishArtifacts:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest
    needs: [PyPIBuild]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          prerelease: false
          files: |
            ./dist/*/resurfemg-*.tar.gz
            ./dist/*/resurfemg-*.whl
